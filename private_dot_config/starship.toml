"$schema" = 'https://starship.rs/config-schema.json'

# ── lambda ────────────────────────────────────────────────────────────────────
# Recreation of the prompt in the reference screenshot, which is itself inspired
# by the fish theme https://github.com/netologist/theme-lambda:
#
#   ╭─malte on laptopalte in ~/.config on 🌱 mast took 8s591ms
#   ╰─λ
#
# Colours are sampled from that screenshot, not from the fish source, because a
# terminal renders the theme's 256-colour values slightly differently — and the
# corner colour there is derived per host (md5 of the hostname), pinned here.
palette = 'lambda'

add_newline = false
command_timeout = 1000

format = '[╭─](corner)$username[ on ](text)$hostname${custom.distrobox}[ in ](text)$directory$git_branch$git_commit$git_state$git_status$cmd_duration$fill$time$line_break[╰─](corner)$jobs$python$character'
right_format = ''

[palettes.lambda]
fg     = '#ffffff'   # plain foreground: the ▸ / ◂ prompt arrow
muted  = '#77767b'   # the clock on the right margin (old theme's grey)
corner = '#5b7683'   # the ╭─ / ╰─ glyphs, and the clock
text   = '#d5d7d9'   # the words "on" / "in" / "took"
user   = '#efd25c'   # username, and the command duration
host   = '#d54f8b'   # hostname
path   = '#00c6dc'   # working directory
branch = '#cb75f7'   # git branch name
leaf   = '#83b64f'   # the git symbol
teal   = '#1addb3'   # box badge, git status
warn   = '#efd25c'   # background jobs, long commands
err    = '#df005f'   # root user, failed command

[username]
show_always = true
style_user = 'bold user'
style_root = 'bold err'
format = '[$user]($style)'

[hostname]
ssh_only = false
style = 'bold host'
format = '[$hostname]($style)'

# Distrobox badge, after the hostname: `⬢ dev`. Empty on the host.
[custom.distrobox]
when = '[ -n "${CONTAINER_ID:-}" ]'
command = 'printf "%s" "$CONTAINER_ID"'
format = '[ ⬢ $output](bold teal)'
disabled = false

[directory]
style = 'bold path'
format = '[$path]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true      # inside a repo, shorten to the repo root
read_only = ' 🔒'
read_only_style = 'err'

[git_branch]
# the fish theme shows the sprout, the branch name in purple, and a space
symbol = '🌱 '
style = 'bold branch'
format = '[ on ](text)[$symbol](bold leaf)[$branch]($style)'
truncation_length = 32

[git_status]
style = 'bold teal'
# the leading space lives inside the group: `main ⇡2`, not `main⇡2`
format = '( [$all_status$ahead_behind]($style))'
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'
stashed = '\$${count}'

[git_commit]
style = 'muted'
format = ' [\\($hash$tag\\)]($style)'
only_detached = true

[git_state]
style = 'bold warn'
format = ' [%state( $progress_current/$progress_total)]($style)'

# fish's `took 8s591ms`
[cmd_duration]
min_time = 1000
show_milliseconds = true
format = '[ took ](text)[$duration](bold warn)'

# `$fill` pads line 1 so `$time` lands on the right margin. A multi-line prompt
# whose first line ends flush with the edge makes zle eat a line on every redraw
# (Tab), so 99-prompt.zsh hands starship a terminal two columns narrower than the
# real one: the fill stops 2 columns short of the margin, the clock stays right
# aligned, and zle's row count stays correct. Keep the two in step.
[fill]
symbol = ' '
style = ''

[time]
disabled = false
time_format = '%H:%M:%S'
# the old theme's muted grey for the clock
style = 'muted'
format = '[$time]($style)'

# Small arrow instead of the lambda glyph. Each symbol carries its own trailing
# space so the cursor starts one column after the arrow; `format` stays a bare
# `$symbol` so nothing else is drawn next to it.
#
# Vi mode: ▸ insert, ◂ normal, ▴ visual/replace. Starship 1.27.0 only reports
# these for fish (src/modules/character.rs: Visual/Replace map from Shell::Fish);
# zsh passes `vicmd` for normal mode and nothing else, so ◂ works under
# `bindkey -v` while the ▴ entries stay inert there — kept anyway, they cost
# nothing and are what other arrow-based configs ship.
[character]
format = '$symbol'
success_symbol = '[▸](fg) '
error_symbol = '[×](bold err) '
vimcmd_symbol = '[◂](fg) '
vimcmd_replace_one_symbol = '[▴](bold warn) '
vimcmd_replace_symbol = '[▴](bold warn) '
vimcmd_visual_symbol = '[▴](bold warn) '

[jobs]
# `✦2` when two background jobs are running; silent otherwise.
symbol = '✦'
number_threshold = 1
style = 'bold warn'
format = '[$symbol$number]($style) '

[python]
style = 'bold path'
format = '([$virtualenv]($style) )'
detect_extensions = ['py', 'ipynb']

[package]
disabled = true

[status]
disabled = true
