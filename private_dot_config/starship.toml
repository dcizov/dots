"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 1000
palette = 'adwaita_dark'

# `$fill` pins $time to the right margin by padding line 1 to the full terminal
# width. That is a known trigger for a zsh redraw bug with multi-line prompts, so
# ~/.config/zsh/conf.d/99-prompt.zsh hands starship a terminal two columns
# narrower than the real one — the fill then stops just short of the margin.
# Keep the two in sync: if you remove `$fill` here, drop that adjustement too.
format = '[╭─](dim)$username$hostname${custom.distrobox}$directory$git_branch$git_commit$git_state$git_status$cmd_duration$fill$time$line_break[╰─](dim)$python$character'
right_format = ''

[palettes.adwaita_dark]
accent      = '#62a0ea'
accent_soft = '#99c1f1'
ok          = '#57e389'
ok_dim      = '#2ec27e'
warn        = '#f5c211'
err         = '#ed333b'
purple      = '#c061cb'
fg          = '#ffffff'
path        = '#deddda'
dim         = '#9a9996'
muted       = '#77767b'

[username]
show_always = true
style_user = 'bold accent'
style_root = 'bold err'
format = '[$user]($style)'

[hostname]
ssh_only = false
style = 'bold accent_soft'
format = '[ at ](dim)[$hostname]($style)'

[directory]
style = 'bold path'
repo_root_style = 'bold fg'
format = '[ in ](dim)[$path]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true
read_only = ' 🔒'
read_only_style = 'err'

[git_branch]
symbol = '🌱 '
style = 'bold ok_dim'
format = '[ on ](dim)[$symbol$branch]($style)'
truncation_length = 32

[git_commit]
style = 'dim'
format = ' [\\($hash$tag\\)]($style)'
only_detached = true

[git_state]
style = 'bold warn'
format = ' [%state( $progress_current/$progress_total)]($style)'

[git_status]
style = 'bold accent_soft'
format = '( [$all_status$ahead_behind]($style))'
conflicted = '[=](bold err)'
ahead = '[⇡${count}](bold ok)'
behind = '[⇣${count}](bold err)'
diverged = '[⇕⇡${ahead_count}⇣${behind_count}](bold warn)'
untracked = '[?${count}](bold accent_soft)'
stashed = '[\\$${count}](bold muted)'
modified = '[!${count}](bold warn)'
staged = '[+${count}](bold ok)'
renamed = '[»${count}](bold warn)'
deleted = '[✘${count}](bold err)'

[cmd_duration]
min_time = 2000
show_milliseconds = false
format = '[ took ](dim)[$duration](bold warn)'

[fill]
symbol = ' '
style = ''

[time]
disabled = false
time_format = '%H:%M:%S'
style = 'muted'
format = '[$time]($style)'

[python]
style = 'bold accent_soft'
format = '([$virtualenv]($style) )'
detect_extensions = ['py', 'ipynb']

[line_break]
disabled = false

[character]
format = '$symbol'
success_symbol = '[▸](fg) '
error_symbol = '[×](bold err) '
vimcmd_symbol = '[◂](fg) '

[jobs]
style = 'bold warn'
symbol = '✦'
number_threshold = 1
format = '[$symbol$number]($style) '

[package]
disabled = true

[status]
disabled = true

# Distrobox badge — from gist mmaeusezahl/9de899ac, with two changes:
#
#   * `when` is POSIX. starship runs it with `sh -c`, and inside the box /bin/sh
#     is dash, where `[[ … ]]` is a syntax error — the gist's bash-only test
#     would fail there and the badge would never show exactly where it matters.
#   * a hexagon instead of the gist's Nerd-Font box glyph, which is a
#     private-use codepoint and renders as tofu unless the font has it.
#
# $CONTAINER_ID is set by distrobox inside the container and empty on the host.
[custom.distrobox]
when = '[ -n "${CONTAINER_ID:-}" ]'
command = 'printf "%s" "$CONTAINER_ID"'
symbol = '⬢'
style = 'bold ok'
format = '[ in ](dim)[$symbol $output]($style)'
disabled = false
