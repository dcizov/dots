# ---------------------------------------------------------------------------
# distrobox manifest for the `dev` box — chezmoi-managed, plain INI (no template)
#
#   create/update : ucli devbox-reconcile   (chezmoi only SHIPS these files;
#                                            it never runs container commands)
#   rebuild       : ucli devbox-recreate    (image / volumes / init_hooks changed)
#   manual        : distrobox assemble create --file ~/.config/distrobox/dev.ini
#   on demand     : just devbox-reconcile
#
# IMAGE — pinned to the Debian major on purpose. `debian:latest` / `debian:stable`
# float: a box created today (trixie) and one created after the next release
# (forky) would be different systems under one dotfiles commit, and the PHP
# purge map in provision-dev.sh would silently point at the wrong branch.
#
#   current: debian:13 = trixie (13.7). To move every machine, edit THIS line,
#   commit, then on each box:
#       chezmoi update
#       ucli devbox-recreate
#   The reconcile script reads `image=debian:<N>` from this file, so this line
#   is the single source of truth for the Debian version.
#
# PACKAGES — `additional_packages` is deliberately tiny: distrobox installs the
# list with ONE `apt install`, so a single package that disappeared from a
# future release aborts container creation. Interactive tooling is installed
# best-effort, one package at a time, by provision-dev.sh.
#
# Node and PHP are NOT from the Debian archive:
#   * bookworm's nodejs is 18.20.4 (the app needs >= 22.14, Next 16 needs
#     >= 20.9) -> nvm installs Node LTS for the container user.
#   * apt's php-cli is 8.2 (bookworm) / 8.4 (trixie) -> PHP comes from
#     deb.sury.org (default 8.5, override in ~/.config/distrobox/devbox.env).
#   provision-dev.sh purges the archive's node/php first, so nothing shadows
#   them in non-interactive shells (`docker compose exec`, `bash -lc`, ssh).
#
# HOOKS — they run as ROOT with HOME=/root, so they must NOT rely on $HOME.
# Each hook line ends with ';' because multiple `init_hooks=` lines are only
# joined correctly on distrobox with bash >= 5.2 (upstream issue #806).
#
# NOTE: `$(...)` IS expanded host-side. assemble base64-decodes every hook and
# `eval`s the whole `distrobox-create … --init-hooks '<script>'` line under
# `set -u` (see the variable-free note below), so a command substitution in a
# hook would run on the HOST, not in the container. The hook below therefore
# contains no substitution.
#
# No `volume=` for the script: distrobox already bind-mounts the host home at
# the same absolute path, so ~/.config/distrobox/provision-dev.sh is inside the
# container without any extra plumbing.
#
# HOOKS MUST STAY VARIABLE-FREE: no `$VAR`, no `$(...)`, no embedded quotes.
# The bash `distrobox-assemble` (1.8.x, what Arch ships) base64-decodes each hook
# and then `eval`s the whole `distrobox-create ... --init-hooks '<script>'` line
# under `set -u`, so a `$D` in a hook aborts creation with
#   distrobox-assemble: line 474: D: unbound variable
# and quotes get re-parsed. Provisioning therefore runs from the host side
# (~/.config/ucli/scripts/devbox/devbox-reconcile.sh via `podman exec`), which
# `ucli devbox-reconcile` invokes. The only hook left
# here starts sshd, which is a per-boot service and needs no variables.
# ---------------------------------------------------------------------------

# NOTE: do NOT add `replace=true|false` to this section. In distrobox <= 1.8.x
# (the bash implementation Arch ships) any `replace=` line in the manifest
# OVERRIDES `--replace` on the command line, so
#   distrobox assemble create --replace ...
# prints "Creating dev..." / "dev already exists" and exits 0 without doing
# anything. The reconcile script therefore removes the container explicitly
# (distrobox rm -f) before creating it, and verifies /etc/debian_version after.

[dev]
image=debian:13
pull=true
root=false
start_now=false
init=false
entry=false

additional_packages="ca-certificates curl sudo"


# sshd is a service, not a one-shot: it has to run on every container boot
# (init=false, so nothing else supervises it).
init_hooks="if [ -x /usr/sbin/sshd ]; then install -d -m 755 /run/sshd || true; ssh-keygen -A 2>/dev/null || true; /usr/sbin/sshd -t 2>/dev/null || true; pgrep -x sshd 2>/dev/null || /usr/sbin/sshd -p 2222 2>/dev/null || true; fi; true"
