# Atuin config: ~/.config/atuin/config.toml

update_check = false
auto_sync = true
sync_frequency = "1h"

search_mode = "daemon-fuzzy"
filter_mode = "global"
workspaces = true

enter_accept = false
style = "compact"
inline_height = 20
show_preview = true
max_preview_height = 6
show_help = true
show_tabs = true

secrets_filter = true
history_filter = [
  "password",
  "token",
  "api[_-]?key",
  "Authorization:",
  "Bearer ",
]

[daemon]
enabled = true
autostart = true
