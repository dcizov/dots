foreground #d5d7d9

color0  #222e34
color1  #df005f
color2  #83b64f
color3  #efd25c
color4  #00c6dc
color5  #cb75f7
color6  #1addb3
color7  #d5d7d9
color8  #5b7683
color9  #ff5f8f
color10 #a6d97a
color11 #ffe98a
color12 #5ce6f2
color13 #e0a3ff
color14 #5cf5d0
color15 #ffffff
